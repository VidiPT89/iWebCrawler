name: iWebCrawler
options:
  bundleIdPrefix: dev.ividi
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.1'
    CURRENT_PROJECT_VERSION: '2'
    INFOPLIST_KEY_CFBundleDisplayName: iWebCrawler
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: iWebCrawler
    PRODUCT_MODULE_NAME: iWebCrawler
    PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.iwebcrawler
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: YES
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoadsInWebContent: YES
targets:
  iWebCrawler:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources: [iWebCrawler]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  iWebCrawler-macOS:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources: [iWebCrawler]
    settings:
      base:
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
